name: wheels

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - id: version
        name: Check version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          def get_version(text):
              return tomllib.loads(text)["project"]["version"]

          current = get_version(open("pyproject.toml", encoding="utf-8").read())

          try:
              previous = get_version(
                  subprocess.check_output(
                      ["git", "show", f"{os.environ['BEFORE']}:pyproject.toml"],
                      text=True,
                  )
              )
          except subprocess.CalledProcessError:
              previous = None

          changed = current != previous
          print(f"{previous or '(none)'} -> {current}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"changed={str(changed).lower()}", file=output)
          PY

      - name: Build GeoSpace
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install -U uv twine
          uv build --wheel --out-dir build

      - name: Download tested GDAL wheels
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir gdal-wheels
          gh release download             --repo xiejx5/gdal-wheels             --pattern '*.whl'             --dir gdal-wheels

      - name: Bundle GDAL
        if: steps.version.outputs.changed == 'true'
        run: python ci/bundle-gdal.py

      - name: Check wheels
        if: steps.version.outputs.changed == 'true'
        run: twine check dist/*.whl

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.changed == 'true'
        with:
          name: dist
          path: dist/*.whl

  publish:
    needs: build
    if: needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/geospace
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
